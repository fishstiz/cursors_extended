import me.modmuss50.mpp.ReleaseType

plugins {
    id 'fabric-loom' version "$loom_version" apply false
    id 'net.neoforged.moddev' version "$mdg_version" apply false
    id "me.modmuss50.mod-publish-plugin"
}

allprojects {
    apply plugin: 'java'

    version = project.mod_version
    group = project.maven_group

    base {
        archivesName = "${project.archives_base_name}-${convertToKebabCase(project.name)}"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = java_version.toInteger()
    }
}

static String convertToKebabCase(String input) {
    return input.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase()
}

publishMods {
    dryRun = Boolean.valueOf(dry_run)
    type = ReleaseType.of(release_type)
    changelog = file("CHANGELOG.md").text

    github {
        accessToken = findProperty("GITHUB_TOKEN") ?: ""
        repository = "fishstiz/cursors_extended"
        commitish = "mc/$minecraft_version"
        version = mod_version
        tagName = "v${this.version}"
        displayName = "v${this.version}"
        allowEmptyFiles = true
    }
}
